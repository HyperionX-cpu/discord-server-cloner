services:
  discord-cloner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-cloner-app
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - PORT=4000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4000}
      - SESSION_SECRET=${SESSION_SECRET:-replace_with_a_secure_random_string_32_chars}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-http://localhost:4000/api/auth/callback}
    env_file:
      - path: .env
        required: false
